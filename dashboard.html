<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Dashboard</h1>

    <h3 id="user"></h3>
    <h3 id="score"></h3>
    <h3 id="personality"></h3>

    <button onclick="goToInterview()">Start Interview</button>
</div>

<script src="script.js"></script>
<script>
    document.getElementById("user").innerText =
        "User: " + localStorage.getItem("user");

    document.getElementById("score").innerText =
        "Last Score: " + (localStorage.getItem("score") || 0);

    document.getElementById("personality").innerText =
        "Personality: " + (localStorage.getItem("personality") || "N/A");
</script>
</body>
</html>
